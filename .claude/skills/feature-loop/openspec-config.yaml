# Copied to <repo>/openspec/config.yaml by the feature-loop skill when it runs
# `openspec init` in a repo that has no OpenSpec root yet. Context and rules
# reach every `openspec instructions ...` call; they are constraints for the
# agent, never content for the artifacts.
schema: spec-driven

context: |
  SkillCorner repository (Python, uv, ruff, pytest). A feature can span several
  repos, released in this order: shared libs (data-provider-clients, skcr-utils,
  skcr-models, ...) -> son -> wilson -> football. Each repo carries its own
  OpenSpec change, under the same change name, describing only the behaviour
  that changes in this repo.
  Libraries are prereleased with pirlo and pinned in consumers: a prerelease
  may appear only in uv.lock, never in pyproject.toml, which always names the
  final version.

rules:
  proposal:
    - Start with a "Verdict" line - clear, needs clarification, or not feasible as written - and the ticket link.
    - Under Impact, name the other repos of the feature and what this repo needs from them (or provides to them).
  specs:
    - Write scenarios that can be checked on a deployed environment (API response, lambda output, rows in a table, pipeline status); QA turns each scenario into one check, with the THEN step as the oracle.
    - Cover the football-domain edge cases from the football brief (extra time, penalties, placeholder teams, split seasons, ...) when they apply.
  design:
    - Always write design.md.
    - Cite each place of interest as path:line and name the existing pattern to follow.
    - State the scope class and target env (dev-workflow section 0) and, for libraries, the version bump.
  tasks:
    - Group tasks by package or module of this repo only; never list work that belongs to another repo.
    - Each implementation task starts with a failing test and names the targeted test command (never the full wilson suite, never -n auto, -n 2 at most).
    - End with a "Release" group - ruff, library version bump and uv lock when this repo is a library.
    - Put deploy, QA and archive under "## Workflow follow-up" as plain bullets; the feature-loop skill tracks them.

operations:
  apply:
    guidance:
      - Work only in this repo's feature worktree, never in the workspace mirror.
      - Commit and push after each task group.
